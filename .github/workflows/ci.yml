name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Prettier
        run: npm run format:check

      - name: Markdownlint
        run: npm run markdownlint

      - name: Eslint
        run: npm run eslint

      - name: Unit Tests
        run: npm test

  test-action:
    name: Run this GitHub Action
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run the Action
        uses: ./
        with:
          verbose: true
          path: tests/data/minimal-test.xml
