name: Validate Agama JSON profiles
description:
  Extract the examples of the Agama autoinstallation profiles from the documentation and validate
  them against the Agama JSON schema.

inputs:
  mode:
    description:
      'Set the validator mode. Supported values: ''normal'' - validate the <screen> JSON snippets
      marked with `language="agama-json"` attribute, ''all'' - validate all <screen> blocks which
      look like a JSON, ''missing'' - report <screen> blocks which do not set language attribute,
      but validate against the Agama JSON schema.'
    default: normal

  path:
    description:
      Path to the documentation file. If a directory is used all XML files in the directory and
      subdirectories will be processed.
    default: "."

  schema:
    description:
      'The version of the Agama JSON schema to use. Can be "latest", "SLE-16.0", "SLE-16.1", or any
      Agama Git branch name, or a full URL.'
    default: latest

  verbose:
    description: Display verbose output while processing the input files.
    default: "false"

runs:
  using: node24
  main: dist/index.js
